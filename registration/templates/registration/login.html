{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="{% static 'registration/style.css' %}"
    >

</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <p class="subtitle">
            Login to access your account
        </p>


        <!-- LOGIN ERROR -->

        {% if error %}

        <div
            style="
                background: #421818;
                color: #ff8a8a;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
                text-align: center;
            "
        >
            {{ error }}
        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form
            method="POST"
            action="/login/"
        >

            {% csrf_token %}


            <!-- EMAIL -->

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                name="email"
                placeholder="Enter your email address"
                required
            >


            <!-- PASSWORD -->

            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter your password"
                required
            >


            <!-- LOGIN BUTTON -->

            <button type="submit">
                Login
            </button>

        </form>


        <!-- BACK TO HOME -->

        <a
            href="/"
            style="
                display: block;
                text-align: center;
                margin-top: 20px;
                color: #b875ff;
                text-decoration: none;
            "
        >
            ← Back to Home
        </a>

    </div>


    <footer>
        Registration System
    </footer>

</body>

</html>
