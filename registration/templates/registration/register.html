{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration Form</title>

    <link
        rel="stylesheet"
        href="{% static 'registration/style.css' %}"
    >

</head>


<body>

    <div class="container">

        <h1>Registration Form</h1>

        <p class="subtitle">
            Please fill the details carefully
        </p>


        <form
            id="registrationForm"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- =========================
                 PERSONAL DETAILS
            ========================== -->

            <!-- Name -->
            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <!-- Email -->
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >


            <!-- Password -->
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <!-- Phone -->
            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone_number"
                placeholder="Enter your 10-digit phone number"
                required
            >


            <!-- Address -->
            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter your complete address"
                required
            ></textarea>


            <!-- Date of Birth -->
            <label for="dob">
                Date of Birth
            </label>

            <input
                type="date"
                id="dob"
                name="dob"
                required
            >


            <!-- Website -->
            <label for="website">
                Website
            </label>

            <input
                type="url"
                id="website"
                name="website"
                placeholder="https://example.com"
                required
            >


            <!-- =========================
                 OTHER DETAILS
            ========================== -->

            <!-- State -->
            <label for="state">
                State
            </label>

            <select
                id="state"
                name="state"
                required
            >

                <option value="">
                    Select your state
                </option>

                <option value="Tamil Nadu">
                    Tamil Nadu
                </option>

                <option value="Kerala">
                    Kerala
                </option>

                <option value="Karnataka">
                    Karnataka
                </option>

                <option value="Andhra Pradesh">
                    Andhra Pradesh
                </option>

                <option value="Telangana">
                    Telangana
                </option>

                <option value="Maharashtra">
                    Maharashtra
                </option>

                <option value="Delhi">
                    Delhi
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- Languages -->
            <label for="languages">
                Languages
            </label>

            <select
                id="languages"
                name="languages"
                multiple
                required
            >

                <option value="Tamil">
                    Tamil
                </option>

                <option value="English">
                    English
                </option>

                <option value="Hindi">
                    Hindi
                </option>

                <option value="Telugu">
                    Telugu
                </option>

                <option value="Malayalam">
                    Malayalam
                </option>

                <option value="Kannada">
                    Kannada
                </option>

            </select>

            <small>
                Select the languages you know
            </small>


            <!-- Gender -->
            <label>
                Gender
            </label>

            <div class="radio-group">

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Male"
                    >
                    Male
                </label>


                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Female"
                    >
                    Female
                </label>


                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Other"
                    >
                    Other
                </label>

            </div>


            <!-- Skills -->
            <label>
                Skills
            </label>

            <div class="checkbox-group">

                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="Java"
                    >
                    Java
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="Python"
                    >
                    Python
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="JavaScript"
                    >
                    JavaScript
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="SQL"
                    >
                    SQL
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="React"
                    >
                    React
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="Django"
                    >
                    Django
                </label>

            </div>


            <!-- Experience -->
            <label for="experience">
                Experience
            </label>

            <div class="range-container">

                <input
                    type="range"
                    id="experience"
                    name="experience"
                    min="0"
                    max="10"
                    value="0"
                >

                <span id="experienceValue">
                    0
                </span>

                <span>
                    years
                </span>

            </div>


            <!-- =========================
                 FILE UPLOADS
            ========================== -->

            <!-- Photo -->
            <label for="photo">
                Profile Photo
            </label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/jpeg,image/png,image/webp"
                required
            >


            <!-- Resume -->
            <label for="resume">
                Resume
            </label>

            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,application/pdf"
                required
            >


            <!-- Audio -->
            <label for="audio">
                Audio
            </label>

            <input
                type="file"
                id="audio"
                name="audio"
                accept="audio/*"
            >


            <!-- Video -->
            <label for="video">
                Video
            </label>

            <input
                type="file"
                id="video"
                name="video"
                accept="video/*"
            >


            <!-- Submit -->
            <button type="submit">
                Register
            </button>

        </form>

    </div>


    <!-- Footer -->

    <footer>
        Fill the details carefully
    </footer>


    <!-- JavaScript -->

    <script src="{% static 'registration/script.js' %}"></script>

</body>

</html>
